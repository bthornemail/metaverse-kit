<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Metaverse Demo Portal (Replay Viewer)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>Demo Metaverse Portal</h1>
    <div id="status">Loading bundle…</div>
    <button id="exportProposal" type="button">Export Proposal</button>
    <div id="proposalStatus" class="small"></div>
  </header>
  <main>
    <section>
      <h2>Harmonic Timeline</h2>
      <div id="harmonic"></div>
    </section>
    <section>
      <h2>Waveform</h2>
      <div class="row">
        <label class="small"><input id="waveformToggle" type="checkbox" /> Enable waveform layer</label>
        <span id="waveformStatus" class="small"></span>
      </div>
      <div id="waveform2d" class="waveform2d"></div>
      <canvas id="waveform3d" class="waveform3d" width="900" height="420"></canvas>
    </section>
    <section>
      <h2>Civic Graph</h2>
      <div id="graph"></div>
    </section>
    <section>
      <h2>Narrative</h2>
      <div id="story"></div>
    </section>
    <section>
      <h2>Narrative States</h2>
      <div id="narrativeState"></div>
    </section>
    <section>
      <h2>Entity Scene</h2>
      <div id="entityScene"></div>
    </section>
    <section>
      <h2>World Relations</h2>
      <div id="worldRelations"></div>
    </section>
    <section>
      <h2>World Behavior</h2>
      <div id="worldBehavior"></div>
    </section>
  </main>
  <script type="module" src="./runtime.js"></script>
</body>
</html>
