name: wave19 graph guard

on:
  pull_request:
    paths:
      - "docs/WAVE19_WORLD_GRAPH_*"
      - "tools/mv-world-graph/**"
      - "scripts/wave19-graph-*"
      - "dev-docs/wave19/**"
      - "portal/**"
      - "package.json"
      - ".github/workflows/wave19-graph-guard.yml"
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  wave19-graph:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install deps
        run: npm ci

      - name: wave19 graph golden
        run: npm run -s wave19:graph:golden

      - name: wave19 graph must-reject
        run: npm run -s wave19:graph:must-reject
