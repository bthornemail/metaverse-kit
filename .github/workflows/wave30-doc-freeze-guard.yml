name: wave30 doc freeze guard

on:
  pull_request:
    paths:
      - "docs/WAVE30_*"
      - "docs/PROTOCOL_SPEC.md"
      - "docs/index.md"
      - "scripts/check-wave30-doc-freeze.sh"
      - "package.json"
      - ".github/workflows/wave30-doc-freeze-guard.yml"
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  wave30-doc-freeze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install deps
        run: npm ci
      - name: wave30 doc freeze
        run: npm run -s check:wave30-doc-freeze
