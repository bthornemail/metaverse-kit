name: runtime handoff wave30 guard

on:
  pull_request:
    paths:
      - "docs/LAYER_CONTRACT_RUNTIME_HANDOFF_METAVERSE_BUILD.md"
      - "tools/mv-runtime-handoff/**"
      - "scripts/runtime-handoff-wave30-*"
      - "scripts/check-runtime-handoff-wave30-contract.sh"
      - "dev-docs/wave30/**"
      - "package.json"
      - ".github/workflows/runtime-handoff-wave30-guard.yml"
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runtime-handoff-wave30:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install deps
        run: npm ci
      - name: runtime handoff contract
        run: npm run -s check:runtime-handoff-contract
      - name: runtime handoff wave30 contract
        run: npm run -s check:runtime-handoff-wave30-contract
