name: wave21 merge guard

on:
  pull_request:
    paths:
      - "docs/WAVE21_*"
      - "tools/mv-world-merge/**"
      - "scripts/wave21-*"
      - "dev-docs/wave21/**"
      - "package.json"
      - ".github/workflows/wave21-merge-guard.yml"
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  wave21-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install deps
        run: npm ci

      - name: wave21 golden
        run: npm run -s wave21:golden

      - name: wave21 must-reject
        run: npm run -s wave21:must-reject
